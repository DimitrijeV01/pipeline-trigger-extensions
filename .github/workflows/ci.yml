name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tfsrestservice:
    name: tfsrestservice
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tfsrestservice
        run: npm install

      - name: Compile TypeScript
        working-directory: tfsrestservice
        run: npx tsc

      - name: Run tests
        working-directory: tfsrestservice
        run: npm test
